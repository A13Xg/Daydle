name: Phase 9 hotfix formatter
on:
  push:
    branches: [hotfix/phase09-runtime-secret-binding]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/deployment-preflight.test.ts
      - run: |
          echo '__DAYDLE_FORMAT_BEGIN__'
          base64 -w0 tests/deployment-preflight.test.ts
          echo
          echo '__DAYDLE_FORMAT_END__'
