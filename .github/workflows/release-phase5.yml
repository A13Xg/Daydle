name: Release Phase 5 — schema-first production rollout

# Manual, main-only release. Existing "production" environment reviewer and
# deployment-branch policy protect every step that can access credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Require merged main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          echo "Releasing reviewed main commit $GITHUB_SHA"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies and preflight checks
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Validate production account and secrets before writes
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          for field in SUPABASE_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "$(printenv "$field")" ]]; then
              echo "Required production configuration missing: $field" >&2
              exit 1
            fi
          done
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]] || { echo "Invalid project reference" >&2; exit 1; }
          [[ "$VITE_SUPABASE_URL" == "https://$SUPABASE_PROJECT_ID.supabase.co" ]] || {
            echo "Supabase project reference does not match browser URL" >&2
            exit 1
          }
          [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_* ]] || {
            echo "Invalid public key format" >&2
            exit 1
          }

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.117.0

      - name: Link and check remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          # Read applied migrations through the official structured Management
          # API. CLI migration list produces human-formatted tables whose layout
          # and output stream are not a stable production authorization format.
          # The project already records both Phase 2 and Phase 3 versions.
          node scripts/ops/check-hosted-migrations.mjs
          supabase db push --linked --dry-run

      - name: Apply reviewed migrations only
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --linked --yes
          node scripts/ops/check-hosted-migrations.mjs --require-all-applied

      - name: Build production PWA using public project configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify generated Worker-first API routing
        run: node scripts/ops/verify-live-release.mjs --routing-only

      - name: Deploy Daydle Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Verify live API, Today and deployed PWA asset version
        # A Cloudflare deploy can succeed before every edge/asset route serves
        # the latest version. HTTP 200 with SPA HTML is NOT an API success.
        # Wait for expected JSON contracts and the built service worker version.
        run: node scripts/ops/verify-live-release.mjs
