name: Supabase keep-alive

# One row-limited, read-only database request daily. The previous "*/6" day
# expression could leave a SEVEN-day gap between the 25th of a 30-day month
# and the 1st of the next. A daily schedule avoids that calendar edge case.
#
# This is a best-effort inactivity probe, NOT an uptime guarantee: GitHub may
# delay scheduled runs and disable schedules after prolonged repository inactivity.
# Monitor Actions notifications/last success; this is not a backup.
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.KEEPALIVE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.KEEPALIVE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Read one public row through the API
        run: node scripts/ops/keepalive.mjs
