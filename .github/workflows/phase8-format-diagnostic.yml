name: Phase 8 temporary formatting diagnostic
on:
  push:
    branches:
      - phase/08-personal-statistics-achievements
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write shared/statistics.ts tests/statistics.test.ts worker/results.ts worker/index.ts src/App.tsx src/lib/statistics-api.ts src/components/StatisticsPage.tsx
      - name: Print formatted file data for source reconciliation
        run: |
          for file in shared/statistics.ts tests/statistics.test.ts worker/results.ts worker/index.ts src/App.tsx src/lib/statistics-api.ts src/components/StatisticsPage.tsx; do
            printf '__DAYDLE_FORMAT_BEGIN__%s\n' "$file"
            base64 -w0 "$file"
            printf '\n__DAYDLE_FORMAT_END__%s\n' "$file"
          done
