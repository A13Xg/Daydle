name: Phase 8 temporary formatting diagnostic
on:
  push:
    branches:
      - phase/08-personal-statistics-achievements
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/statistics-worker.test.ts
      - name: Print formatted source for reconciliation
        run: |
          printf '__DAYDLE_FORMAT_BEGIN__tests/statistics-worker.test.ts\n'
          base64 -w0 tests/statistics-worker.test.ts
          printf '\n__DAYDLE_FORMAT_END__tests/statistics-worker.test.ts\n'
