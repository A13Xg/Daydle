name: Phase 14 Formatting Export (temporary)

on:
  push:
    branches:
      - phase/14-beta-readiness-handoff
    paths:
      - .github/workflows/phase14-format-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Export formatted source without commit or credentials
        run: |
          npx --no-install prettier --write src/components/PrivacyPage.tsx tests/beta-preflight.test.ts tests/privacy-ui.test.ts
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for (const path of ["src/components/PrivacyPage.tsx", "tests/beta-preflight.test.ts", "tests/privacy-ui.test.ts"]) {
              console.log("DAYDLE_FMT_B64::" + path + "::" + readFileSync(path).toString("base64"));
            }
          '
