# Temporary, read-only formatting export (revision 3). Remove after synchronizing PR files.
name: Phase 11 Format Export
on:
  push:
    branches:
      - phase/11-admin-requests-diagnostics
    paths:
      - .github/workflows/phase11-format-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - name: Export Prettier-adjusted UTF-8 text
        run: |
          npx prettier --write src/App.tsx src/components/AdminPage.tsx src/components/GameRequestsPage.tsx src/components/AccountPage.tsx src/lib/administration-api.ts worker/administration.ts shared/administration.ts tests/administration-worker.test.ts tests/hosted-migrations.test.ts
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const paths = ["src/App.tsx", "src/components/AdminPage.tsx", "src/components/GameRequestsPage.tsx", "src/components/AccountPage.tsx", "src/lib/administration-api.ts", "worker/administration.ts", "shared/administration.ts", "tests/administration-worker.test.ts tests/hosted-migrations.test.ts"];
            for (const path of paths) {
              console.log("DAYDLE_FMT::" + path + "::" + JSON.stringify(readFileSync(path, "utf8")));
            }
          '
