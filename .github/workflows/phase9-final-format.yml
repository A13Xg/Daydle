name: Phase 9 formatting verification
on:
  push:
    branches:
      - phase/09-public-profiles-instant-friends
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/FriendsPage.tsx
      - run: |
          printf '__DAYDLE_FORMAT_BEGIN__src/components/FriendsPage.tsx\n'
          base64 -w0 src/components/FriendsPage.tsx
          printf '\n__DAYDLE_FORMAT_END__src/components/FriendsPage.tsx\n'
