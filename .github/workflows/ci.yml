name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diagnose effective Worker routing and live public responses (read-only)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("dist/worker/wrangler.json", "utf8"));
          console.log("Generated worker config:", JSON.stringify({
            name: config.name,
            main: config.main,
            routes: config.routes,
            assets: {
              directory: config.assets?.directory,
              binding: config.assets?.binding,
              run_worker_first: config.assets?.run_worker_first,
              not_found_handling: config.assets?.not_found_handling,
            },
          }));
          for (const path of [
            "/api/v1/health", "/api/v1/not-found",
            "/app.webmanifest", "/sw.js", "/today",
          ]) {
            for (const navigation of path === "/api/v1/health" ? [false, true] : [false]) {
              const url = "https://daydle.agoodman.io" + path;
              try {
                const response = await fetch(url, {
                  signal: AbortSignal.timeout(12000),
                  redirect: "manual",
                  cache: "no-store",
                  headers: navigation ? { "sec-fetch-mode": "navigate" } : {},
                });
                const body = await response.text();
                const type = body.trimStart().startsWith("<") ? "html" :
                  body.trimStart().startsWith("{") ? "jsonish" : "other";
                console.log("Live probe", JSON.stringify({
                  path, navigation, status: response.status,
                  contentType: response.headers.get("content-type"),
                  kind: type, length: body.length,
                  redirectHost: response.headers.get("location")
                    ? new URL(response.headers.get("location"), url).host : null,
                }));
              } catch (error) {
                console.log("Live probe error", JSON.stringify({
                  path, navigation, name: error?.name ?? "unknown",
                }));
              }
            }
          }
          NODE
      - name: Preview smoke
        run: |
          npm run preview -- --port 4173 > /tmp/daydle-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          npm run smoke

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run isolated migrations and security assertions
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-db.sh
