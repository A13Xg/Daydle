name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Normalize and emit files for owner commit
        run: |
          npm run format
          node -e '
            const fs = require("node:fs");
            const paths = ["src/App.tsx", "src/lib/api.ts", "src/lib/config.ts", "src/lib/supabase.ts", "src/styles.css", "worker/index.ts", "tests/api.test.ts", "tests/config.test.ts", "tests/worker.test.ts", "index.html", "wrangler.jsonc"];
            for (const path of paths) {
              const raw = fs.readFileSync(path, "utf8");
              console.log("BEGIN_FORMAT_FILE:" + path);
              for (let i = 0; i < raw.length; i += 3000) {
                console.log("FORMAT_CHUNK:" + JSON.stringify(raw.slice(i, i + 3000)));
              }
              console.log("END_FORMAT_FILE:" + path);
            }
          '
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preview smoke
        run: |
          npm run preview -- --port 4173 > /tmp/daydle-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          npm run smoke
