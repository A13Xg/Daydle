name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Temporary Phase 7 UI canonical format
        run: |
          npx prettier --write src/lib/result-view.ts src/components/HistoryPage.tsx src/components/PasteDialog.tsx src/styles.css tests/result-view.test.ts
          node --input-type=module <<'PHASE7_UI_FORMAT'
          import { readFileSync } from 'node:fs';
          const paths = ["src/lib/result-view.ts","src/components/HistoryPage.tsx","src/components/PasteDialog.tsx","src/styles.css","tests/result-view.test.ts"];
          for(const path of paths){
            const encoded = readFileSync(path).toString('base64');
            const chunks = encoded.match(/.{1,760}/g) ?? [];
            chunks.forEach((chunk,index)=>console.log('PHASE7_UI_BASE64:'+JSON.stringify({path,index,total:chunks.length,chunk})));
          }
          PHASE7_UI_FORMAT
      - name: Format check
        run: npm run format:check
      - name: Unit and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preview smoke
        run: |
          npm run preview -- --port 4173 > /tmp/daydle-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          npm run smoke
          node scripts/ui-smoke.mjs

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run isolated migrations and security assertions
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-db.sh
