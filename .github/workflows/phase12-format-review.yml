name: Phase 12 formatting review (temporary)
on:
  push:
    branches:
      - phase/12-privacy-lifecycle-recovery

permissions:
  contents: read

jobs:
  formatted-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format source in isolated runner (no push or secrets)
        run: npm run format
      - name: Emit public source blobs for review and branch update
        shell: bash
        run: |
          set -euo pipefail
          for path in src/components/AccountPage.tsx src/lib/privacy-api.ts worker/index.ts worker/privacy.ts shared/privacy.ts tests/backup-crypto.test.ts tests/hosted-migrations.test.ts tests/privacy-worker.test.ts; do
            printf 'FORMATTED_FILE_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nFORMATTED_FILE_END:%s\n' "$path"
          done
