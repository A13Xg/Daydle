name: Phase 18 release formatter diagnostic
on:
  push:
    branches:
      - phase/10-spoiler-safe-comparisons
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/ops/check-worker-secrets.mjs tests/deployment-preflight.test.ts
      - name: Emit formatted paths only
        run: |
          for path in scripts/ops/check-worker-secrets.mjs tests/deployment-preflight.test.ts; do
            printf '__DAYDLE_FORMAT_BEGIN__%s\n' "$path"
            base64 -w0 "$path"
            printf '\n__DAYDLE_FORMAT_END__%s\n' "$path"
          done
