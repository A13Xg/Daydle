name: Temporary redirect-format diagnostic
on:
  push:
    branches: [hotfix/cloudflare-redirect-mode]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/results-worker.test.ts
      - name: Emit formatted source
        run: |
          echo '__DAYDLE_FORMAT_BEGIN__'
          base64 -w0 tests/results-worker.test.ts
          echo
          echo '__DAYDLE_FORMAT_END__'
