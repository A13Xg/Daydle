name: Phase 8 temporary formatter output
on:
  push:
    branches: [phase/08-personal-statistics-achievements]
permissions:
  contents: read
jobs:
  output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/deployment-preflight.test.ts tests/hosted-migrations.test.ts wrangler.jsonc
      - name: Emit exact formatted source for reconciliation
        run: |
          for path in tests/deployment-preflight.test.ts tests/hosted-migrations.test.ts wrangler.jsonc; do
            printf '__DAYDLE_FORMAT_BEGIN__%s\n' "$path"
            base64 -w0 "$path"
            printf '\n__DAYDLE_FORMAT_END__%s\n' "$path"
          done
