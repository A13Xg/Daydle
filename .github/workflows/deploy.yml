name: Deploy Worker

# Manual production deploy. Runs only when someone starts it, and only from main.
# The `production` environment requires reviewer approval before the job starts, and its
# deployment rule limits it to main, so the Cloudflare token is never exposed to PR jobs.
# Equivalent to scripts/ops/deploy-worker.ps1, with the token held as an environment secret.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deploys run only from main (got $GITHUB_REF)." >&2
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check public configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ "$VITE_SUPABASE_URL" =~ ^https://[^/[:space:]]+/?$ ]] || { echo "VITE_SUPABASE_URL is missing or not an https origin." >&2; exit 1; }
          [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" == sb_publishable_?* ]] || { echo "VITE_SUPABASE_PUBLISHABLE_KEY is missing or not a publishable key." >&2; exit 1; }
          [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z0-9]{20}$ ]] || { echo "SUPABASE_PROJECT_ID missing/invalid." >&2; exit 1; }
          [[ "$VITE_SUPABASE_URL" == "https://$SUPABASE_PROJECT_ID.supabase.co" ]] || { echo "Supabase project URL mismatch." >&2; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "Protected Supabase access token missing." >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "CLOUDFLARE_ACCOUNT_ID is missing." >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "CLOUDFLARE_API_TOKEN secret is missing." >&2; exit 1; }

      - name: Verify the already-applied hosted schema (read-only)
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/ops/check-hosted-migrations.mjs --require-all-applied

      - name: Verify the privileged Worker runtime binding exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler secret list --name daydle-app --format json |
            node scripts/ops/check-worker-secrets.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Apply public runtime bindings to generated Worker config
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/ops/prepare-worker-runtime.mjs
          node scripts/ops/verify-live-release.mjs --routing-only

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Verify deployed APIs, routes and exact PWA version
        run: node scripts/ops/verify-live-release.mjs
